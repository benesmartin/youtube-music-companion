<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Lucide icons (lucide.dev, ISC license), inlined as a sprite -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
        <symbol id="i-prev" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></symbol>
        <symbol id="i-shuffle" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></symbol>
        <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
        <symbol id="i-repeat-1" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></symbol>
        <symbol id="i-thumb-up" viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></symbol>
        <symbol id="i-thumb-down" viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></symbol>
        <symbol id="i-volume" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></symbol>
        <symbol id="i-volume-high" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
        <symbol id="i-volume-muted" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></symbol>
        <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M4.93 19.07a10 10 0 0 1 0-14.14"/><path d="M7.76 16.24a6 6 0 0 1 0-8.49"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
        <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
        <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
        <symbol id="i-timer" viewBox="0 0 24 24"><line x1="10" y1="2" x2="14" y2="2"/><line x1="12" y1="14" x2="15" y2="11"/><circle cx="12" cy="14" r="8"/></symbol>
        <symbol id="i-chevron-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
        <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
        <symbol id="i-play-next" viewBox="0 0 24 24"><path d="M16 12H3"/><path d="M16 18H3"/><path d="M10 6H3"/><path d="M21 18V8a2 2 0 0 0-2-2h-5"/><path d="m16 8-2-2 2-2"/></symbol>
        <symbol id="i-remove" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></symbol>
        <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      </defs>
    </svg>

    <main id="player" hidden>
      <div id="header">
        <img id="artwork" alt="" />
        <div id="panel">
          <div id="title">—</div>
          <div id="artist-row"><span id="artist">—</span></div>
          <div id="album-row"><span id="album"></span><span id="album-year"></span></div>
          <div id="controls">
            <button id="shuffle" title="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
            <button id="previous" title="Previous"><svg><use href="#i-prev"/></svg></button>
            <button id="play-pause" title="Play/Pause">
              <svg class="on-paused"><use href="#i-play"/></svg>
              <svg class="on-playing"><use href="#i-pause"/></svg>
            </button>
            <button id="next" title="Next"><svg><use href="#i-next"/></svg></button>
            <button id="repeat" title="Repeat">
              <svg class="on-all"><use href="#i-repeat"/></svg>
              <svg class="on-one"><use href="#i-repeat-1"/></svg>
            </button>
          </div>
          <input id="seek" type="range" min="0" max="100" step="1" value="0" />
          <div id="time"><span id="position">0:00</span><span class="sep">/</span><span id="duration">0:00</span></div>
          <div id="bottom-row">
            <button id="like" title="Like"><svg><use href="#i-thumb-up"/></svg></button>
            <button id="dislike" title="Dislike"><svg><use href="#i-thumb-down"/></svg></button>
            <div id="more-wrap">
              <button id="more" title="More actions"><svg><use href="#i-more"/></svg></button>
              <div id="more-menu" hidden>
                <div id="menu-main" class="menu-page">
                  <button id="sleep-open">
                    <svg><use href="#i-timer"/></svg>
                    <span class="label">Sleep timer</span>
                    <span id="sleep-status" class="wave"></span>
                    <svg class="chev"><use href="#i-chevron-right"/></svg>
                  </button>
                  <button id="radio"><svg><use href="#i-radio"/></svg><span class="label">Start radio</span></button>
                  <button id="library"><svg><use href="#i-bookmark"/></svg><span class="label" id="library-label">Add to library</span></button>
                  <button id="copy-link" class="copy-btn">
                    <svg class="on-idle"><use href="#i-link"/></svg>
                    <svg class="on-copied"><use href="#i-check"/></svg>
                    <span class="label">Copy link</span>
                  </button>
                  <button id="copy-info" class="copy-btn">
                    <svg class="on-idle"><use href="#i-clipboard"/></svg>
                    <svg class="on-copied"><use href="#i-check"/></svg>
                    <span class="label">Copy title &amp; artist</span>
                  </button>
                </div>
                <div id="menu-sleep" class="menu-page" hidden>
                  <button id="sleep-back"><svg><use href="#i-chevron-left"/></svg><span class="label">Sleep timer</span></button>
                  <div id="sleep-body">
                    <div id="sleep-active">
                      <svg><use href="#i-timer"/></svg>
                      <span id="sleep-remaining">No timer running</span>
                      <button id="sleep-off" title="Stop timer" hidden><svg><use href="#i-stop"/></svg></button>
                    </div>
                    <div id="sleep-presets">
                      <button class="sleep-opt" data-min="15">15m</button>
                      <button class="sleep-opt" data-min="30">30m</button>
                      <button class="sleep-opt" data-min="60">60m</button>
                    </div>
                    <div id="sleep-custom">
                      <input id="sleep-custom-min" type="number" min="1" max="720" placeholder="Custom…" />
                      <button id="sleep-set">Set</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <button id="mute" title="Mute">
              <svg class="on-low"><use href="#i-volume"/></svg>
              <svg class="on-high"><use href="#i-volume-high"/></svg>
              <svg class="on-muted"><use href="#i-volume-muted"/></svg>
            </button>
            <input id="volume" type="range" min="0" max="100" step="1" value="100" />
          </div>
        </div>
      </div>
      <div id="tabs">
        <div class="tab active" data-tab="queue">Queue</div>
        <div class="tab" data-tab="history">History</div>
        <div class="tab" data-tab="lyrics">Lyrics</div>
        <div class="tab" data-tab="search">Search</div>
        <div class="tab" data-tab="playlists">Playlists</div>
        <span id="queue-meta"></span>
      </div>
      <div id="queue-list"><div id="queue-note">Loading queue…</div></div>
      <div id="history-list" hidden></div>
      <div id="lyrics-pane" hidden></div>
      <div id="search-pane" hidden>
        <div id="search-box">
          <svg><use href="#i-search"/></svg>
          <input id="search-input" type="text" placeholder="Search songs…" />
        </div>
        <div id="search-filters" hidden>
          <button class="pill active" data-group="songs">Songs</button>
          <button class="pill" data-group="videos">Videos</button>
        </div>
        <div id="search-results"></div>
      </div>
      <div id="playlists-pane" hidden>
        <div id="playlists-list"></div>
        <div id="playlist-detail" hidden>
          <button id="playlist-back">
            <svg><use href="#i-chevron-left"/></svg>
            <span id="playlist-title" class="label">Playlist</span>
          </button>
          <div id="playlist-tracks"></div>
        </div>
      </div>
    </main>

    <main id="empty" hidden>
      <div id="empty-icon"><svg><use href="#i-music"/></svg></div>
      <p id="empty-title">YouTube Music isn’t open</p>
      <p id="empty-sub">Open it in a tab and this popup becomes your player.</p>
      <button id="open-ytm">Open YouTube Music</button>
    </main>

    <div id="toast" hidden></div>

    <script src="popup.js"></script>
  </body>
</html>
